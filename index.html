<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lane Clash</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #233a2a; }
  body { font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 5px 14px;
         border-radius: 999px; background: #0d1a12cc; font-weight: 800; white-space: nowrap; pointer-events: none; font-size: 14px; }
  #top .cr { font-size: 16px; } #top .a { color: #7fb4ff; } #top .b { color: #ff8a95; } #top .nm { font-weight: 600; opacity: .85; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  #clock { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; } #clock.x2 { color: #e9a6ff; }
  #count { position: fixed; inset: 0; display: grid; place-items: center; font-size: min(22vw, 150px); font-weight: 900; color: #fff; text-shadow: 0 6px 0 #0006; pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: calc(var(--handH, 150px) + 30px); transform: translateX(-50%); background: #000a; padding: 7px 14px; border-radius: 999px; font-size: 13px;
          white-space: nowrap; pointer-events: none; transition: opacity .5s; }
  #net { position: fixed; bottom: calc(var(--handH, 0px) + 6px); left: 10px; font-size: 12px; opacity: .75; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0008; }
  #over[hidden] { display: none; }
  .box { box-sizing: border-box; width: min(382px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: #16241b; border: 1px solid #ffffff22; text-align: center; }
  .box h2 { margin: 0 0 4px; font-size: 26px; } .box p { margin: 0 0 12px; opacity: .85; font-size: 18px; }
  .box h3 { margin: 6px 0 4px; font-size: 13px; color: #ffd166; text-align: left; }
  .box ol { text-align: left; margin: 0 0 12px; padding-left: 24px; font-size: 14px; min-height: 30px; } .box li span { float: right; }
  .box button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #ffd166; color: #2a1d00; font: 800 16px system-ui, sans-serif; cursor: pointer; }
  #safe { position: fixed; bottom: 0; height: 0; padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="top"><span class="nm" id="nmA"></span><span class="cr a" id="crA">♛ 0</span><span id="clock">2:30</span><span class="cr b" id="crB">0 ♛</span><span class="nm" id="nmB"></span></div>
<div id="net">Connecting…</div>
<div id="count"></div>
<div id="hint">Drag a card onto your half of the field</div>
<div id="over" hidden><div class="box">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>Most wins</h3><ol id="board"><li>Loading…</li></ol>
  <button id="again">Play again</button>
</div></div>
<div id="safe"></div>
<script>
/* ═══ LANE CLASH · a Multiplayer Agent starter ═════════════════════════════════════════════
 * Play cards, send units, take their towers. Versus, 2 players; a bot plays the other side when you're alone.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ match length, elixir, towers, and the six unit cards
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   FIELD ......... the map: river, bridges, towers, where you may deploy
 *   BATTLE (HOST) . the simulation: units walk, pick targets, fight; towers shoot; elixir; the
 *                   match phases; the bot. Only the host runs this and writes the shared fields.
 *   MY CARDS ...... my hand of four, elixir, deploying a card
 *   DRAW .......... the field (turned so your side is always at the bottom or left), towers,
 *                   units, arrows, sparks, the hand
 *   HUD & RESULTS . clock, crowns, results card, leaderboard
 *   INPUT ......... drag or tap a card, then the field
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - `match` (one JSON field: id, v, phase, startAt, endsAt, sides, winner, crowns, why) and
 *     `w` (the battle, packed: every unit, tower HP, both elixir counts, recent shots) are
 *     written only by the HOST. `w` goes out about 10 times a second; clients ease toward it.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s). It
 *     simulates every unit and tower, keeps both players' elixir, and plays the bot. A new host
 *     adopts the last `w` and carries on: same units, same towers, same clock.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `hb` (heartbeat), and owns
 *     its hand: which four cards it holds and in what order lives only in its own browser.
 *   - To play a card a player sends the intent "play" {m, c, x, y}; the host checks the elixir
 *     and that (x, y) is on that player's half, then spawns the units. "again" {m} = Play again.
 *   - sides[0] is the bottom (blue) half, sides[1] the top (red): a sessionId or "bot". The
 *     red player sees the field turned around, so everyone's own side is nearest to them.
 *   - ?attract plays offline, bot against bot (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for each match a player wins, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  matchMs: 150000,      // a match lasts 2.5 minutes
  doubleMs: 60000,      // elixir comes twice as fast in the last minute
  countdownMs: 3000,    // 3, 2, 1 before the fight
  resultsMs: 15000,     // results show this long, then a new match starts
  elixirStart: 5, elixirMax: 10,
  elixirMs: 2800,       // one elixir every 2.8 seconds
  towerHp: 1500, kingHp: 2600,
  towerRange: 6.5, towerDmg: 65, towerRate: 1.2, // tower shots per second
  sight: 5.5,           // how far units look for an enemy to fight
  maxUnits: 48,         // units on the field at once
  seatGraceMs: 6000,    // a player silent this long hands its side to the bot
  botThinkMs: 1100,     // the bot looks at its hand this often
  board: "wins",        // leaderboard name
  // The cards. cost in elixir, n units per card, hp, dmg per hit, rate = hits per second, range and
  // speed in tiles (per second), r = size. targets: "ground" (no fliers), "any", or "buildings" only.
  cards: {
    knight:  { name: "Knight",  cost: 3, n: 1, hp: 720,  dmg: 90,  rate: 0.9,  range: 0.9, speed: 1.15, r: 0.48, targets: "ground", face: "#d9dee8" },
    archers: { name: "Archers", cost: 3, n: 2, hp: 190,  dmg: 48,  rate: 0.9,  range: 5,   speed: 1.15, r: 0.36, targets: "any", face: "#9be08f" },
    giant:   { name: "Giant",   cost: 5, n: 1, hp: 2100, dmg: 140, rate: 0.6,  range: 1.0, speed: 0.75, r: 0.72, targets: "buildings", face: "#f0c08a" },
    goblins: { name: "Goblins", cost: 2, n: 3, hp: 140,  dmg: 55,  rate: 1.2,  range: 0.7, speed: 1.9,  r: 0.33, targets: "ground", face: "#8fd14f" },
    bats:    { name: "Bats",    cost: 2, n: 4, hp: 65,   dmg: 36,  rate: 1.4,  range: 0.7, speed: 2.1,  r: 0.27, targets: "any", fly: true, face: "#b69cff" },
    bomber:  { name: "Bomber",  cost: 3, n: 1, hp: 240,  dmg: 115, rate: 0.55, range: 4.5, speed: 1.0,  r: 0.4,  targets: "ground", splash: 1.5, face: "#a5abb8" },
  },
};
const KEYS = Object.keys(CONFIG.cards);
const SIDE = [{ color: "#3d8bfd", dark: "#1d4ea6", name: "Blue" }, { color: "#ff4d5e", dark: "#a5202e", name: "Red" }];
const COLORS = ["#ffd166", "#4fc3f7", "#81c784", "#ff8a65", "#ba68c8", "#f06292"];
const NAME_A = ["Brave", "Swift", "Iron", "Lucky", "Bold", "Sly"], NAME_B = ["Captain", "Warden", "Duke", "Ranger", "Baron", "Squire"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'lane-clash',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback);
  memo.set(key, { raw, v, at: performance.now() });
  return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── FIELD ───────────────────────────────────────────────────────────────────────────
// World units are tiles: x 0..18 across, y 0..32 from the red end (top) to the blue end (bottom).
const FIELD = { w: 18, h: 32, river: 16, bridges: [3.5, 14.5] };
const TOWERS = [ // blue left, blue right, blue king, red left, red right, red king
  { side: 0, x: 3.5, y: 25.5, r: 1.15 }, { side: 0, x: 14.5, y: 25.5, r: 1.15 }, { side: 0, x: 9, y: 29, r: 1.55, king: true },
  { side: 1, x: 3.5, y: 6.5, r: 1.15 }, { side: 1, x: 14.5, y: 6.5, r: 1.15 }, { side: 1, x: 9, y: 3, r: 1.55, king: true },
];
const fullHp = (i) => (TOWERS[i].king ? CONFIG.kingHp : CONFIG.towerHp);
/** May `side` drop a unit at (x, y)? Its own half, off the river, not on top of its towers. */
function validSpot(side, x, y, towers) {
  if (x < 0.5 || x > FIELD.w - 0.5 || (side === 0 ? y < 17.3 || y > 31.6 : y < 0.4 || y > 14.7)) return false;
  return !TOWERS.some((t, i) => t.side === side && towers[i] > 0 && Math.hypot(t.x - x, t.y - y) < t.r + 0.3);
}

// ── BATTLE (HOST) ───────────────────────────────────────────────────────────────────
const host = { last: null };
const world = { matchId: -1, units: [], towers: TOWERS.map((_, i) => fullHp(i)), ex: [0, 0], nextId: 1, shots: [], lastWrite: 0, acc: 0, wasHost: false, bots: [null, null] };
/** The match as state has it, or the host's own newer write that hasn't come back yet. */
function match() {
  const m = shared("match", null);
  return host.last && isHost() && (!m || host.last.v > m.v) ? host.last : m;
}
function writeMatch(m) { m = { ...m, v: (match()?.v ?? 0) + 1 }; host.last = m; net.setShared("match", JSON.stringify(m)); return m; }
function newMatch(id, sides) {
  const t = Date.now();
  resetWorld(id);
  return writeMatch({ id, phase: "play", startAt: t + CONFIG.countdownMs, endsAt: t + CONFIG.countdownMs + CONFIG.matchMs, sides, winner: -1, crowns: [0, 0], why: "" });
}
function resetWorld(id) {
  Object.assign(world, { matchId: id, units: [], towers: TOWERS.map((_, i) => fullHp(i)), ex: [CONFIG.elixirStart, CONFIG.elixirStart], nextId: 1, shots: [], bots: [null, null] });
}
/** Become host: take the battle over exactly as the last `w` has it. */
function adoptWorld(m) {
  const w = shared("w", null);
  if (!w || w.m !== m.id) return resetWorld(m.id);
  // Elixir kept filling since that write (the old host may have frozen seconds ago): add it, like myElixir() shows it.
  const since = Date.now() > m.startAt ? ((performance.now() - (memo.get("w")?.at ?? performance.now())) / CONFIG.elixirMs) * (Date.now() > m.endsAt - CONFIG.doubleMs ? 2 : 1) : 0;
  Object.assign(world, { matchId: m.id, towers: w.tw.slice(), ex: w.ex.map((e) => Math.min(CONFIG.elixirMax, e / 10 + since)), shots: [], bots: [null, null],
    units: w.u.map(([id, k, side, x, y, hp]) => ({ id, k: KEYS[k], side, x: x / 10, y: y / 10, hp, cd: 0.5, tgt: null, look: 0 })) });
  world.nextId = Math.max(0, ...world.units.map((u) => u.id)) + 1;
}
/** A "play" intent (or the host's own card): check elixir and spot, then spawn the units. */
function applyPlay(side, d) {
  const m = match(), C = CONFIG.cards[d && d.c];
  if (!m || !C || m.phase !== "play" || d.m !== m.id || Date.now() < m.startAt || side < 0) return false;
  if (world.ex[side] < C.cost || !validSpot(side, +d.x, +d.y, world.towers) || world.units.length + C.n > CONFIG.maxUnits) return false;
  world.ex[side] -= C.cost;
  for (let i = 0; i < C.n; i++) {
    const a = (i / C.n) * Math.PI * 2 + 0.6, off = C.n > 1 ? 0.6 : 0;
    world.units.push({ id: world.nextId++, k: d.c, side, x: +d.x + Math.cos(a) * off, y: +d.y + Math.sin(a) * off, hp: C.hp, cd: 0.8, tgt: null, look: 0 });
  }
  return true;
}
/** Where a target is: a unit id (>= 0) or a tower (-1 - index). */
function resolve(tgt, byId) {
  if (tgt === null) return null;
  if (tgt < 0) { const i = -1 - tgt; return world.towers[i] > 0 ? { x: TOWERS[i].x, y: TOWERS[i].y, r: TOWERS[i].r, tower: i } : null; }
  const u = byId.get(tgt);
  return u && u.hp > 0 ? { x: u.x, y: u.y, r: CONFIG.cards[u.k].r, unit: u } : null;
}
/** The nearest enemy this unit may fight within sight, else the nearest enemy tower. */
function findTarget(u, C) {
  let best = null, bd = CONFIG.sight;
  if (C.targets !== "buildings") for (const o of world.units) {
    if (o.side === u.side || o.hp <= 0 || (C.targets === "ground" && CONFIG.cards[o.k].fly)) continue;
    const d = Math.hypot(o.x - u.x, o.y - u.y);
    if (d < bd) { bd = d; best = o.id; }
  }
  if (best !== null) return best;
  bd = Infinity;
  TOWERS.forEach((t, i) => { if (t.side !== u.side && world.towers[i] > 0) { const d = Math.hypot(t.x - u.x, t.y - u.y) + (t.king ? 4 : 0); if (d < bd) { bd = d; best = -1 - i; } } });
  return best;
}
/** Ground units cross the river on a bridge: head for the bridge in their lane first. */
function waypoint(u, C, tx, ty) {
  const mine = u.y > FIELD.river ? 1 : -1, theirs = ty > FIELD.river ? 1 : -1;
  if (C.fly || mine === theirs) return [tx, ty];
  const bx = FIELD.bridges[u.x < FIELD.w / 2 ? 0 : 1], onBridge = Math.abs(u.y - FIELD.river) < 1.4 && Math.abs(u.x - bx) < 0.9;
  return onBridge || Math.abs(u.x - bx) <= 0.25 ? [bx, FIELD.river - mine * 1.4] : [bx, FIELD.river + mine * 1.3];
}
function hit(target, dmg, from) {
  if (target.unit) target.unit.hp -= dmg;
  else if (target.tower !== undefined) world.towers[target.tower] = Math.max(0, world.towers[target.tower] - dmg);
}
/** One step of the battle: elixir, every unit, every tower. */
function simStep(dt, m, t) {
  if (t < m.startAt) return;
  const rate = (t > m.endsAt - CONFIG.doubleMs ? 2 : 1) * (ATTRACT ? 2 : 1);
  for (const s of [0, 1]) world.ex[s] = Math.min(CONFIG.elixirMax, world.ex[s] + (dt * 1000 * rate) / CONFIG.elixirMs);
  const byId = new Map(world.units.map((u) => [u.id, u]));
  for (const u of world.units) {
    const C = CONFIG.cards[u.k];
    u.look -= dt; u.cd -= dt;
    let tg = resolve(u.tgt, byId);
    if (!tg || u.look <= 0) { u.tgt = findTarget(u, C); u.look = 0.4; tg = resolve(u.tgt, byId); }
    if (!tg) continue;
    const gap = Math.hypot(tg.x - u.x, tg.y - u.y) - tg.r - C.r;
    if (gap > C.range) { // walk
      const [wx, wy] = waypoint(u, C, tg.x, tg.y), d = Math.hypot(wx - u.x, wy - u.y) || 1;
      u.x += ((wx - u.x) / d) * C.speed * dt; u.y += ((wy - u.y) / d) * C.speed * dt;
    } else if (u.cd <= 0) { // fight
      u.cd = 1 / C.rate;
      hit(tg, C.dmg, u);
      if (C.splash) for (const o of world.units) if (o.side !== u.side && o !== tg.unit && !CONFIG.cards[o.k].fly && Math.hypot(o.x - tg.x, o.y - tg.y) < C.splash) o.hp -= C.dmg * 0.8;
      world.shots.push([u.x, u.y, tg.x, tg.y, C.splash ? 2 : C.range > 2 ? 1 : 0]);
    }
  }
  // Ground units push each other apart and stay out of the river (except on the bridges).
  for (const a of world.units) {
    const A = CONFIG.cards[a.k];
    for (const b of world.units) {
      if (a === b || A.fly !== !!CONFIG.cards[b.k].fly) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = A.r + CONFIG.cards[b.k].r;
      if (d > 0.001 && d < min) { const push = ((min - d) / d) * 0.25; b.x += dx * push; b.y += dy * push; }
    }
    if (!A.fly && Math.abs(a.y - FIELD.river) < 1 && !FIELD.bridges.some((bx) => Math.abs(a.x - bx) < 1)) a.y = FIELD.river + (a.y > FIELD.river ? 1 : -1);
    a.x = Math.max(0.3, Math.min(FIELD.w - 0.3, a.x));
  }
  // Towers shoot the nearest enemy in range.
  world.tcd = world.tcd || [0, 0, 0, 0, 0, 0];
  TOWERS.forEach((tw, i) => {
    world.tcd[i] -= dt;
    if (world.towers[i] <= 0 || world.tcd[i] > 0) return;
    let best = null, bd = CONFIG.towerRange;
    for (const u of world.units) if (u.side !== tw.side && u.hp > 0) { const d = Math.hypot(u.x - tw.x, u.y - tw.y); if (d < bd) { bd = d; best = u; } }
    if (!best) return;
    world.tcd[i] = 1 / CONFIG.towerRate; best.hp -= CONFIG.towerDmg * (tw.king ? 1.3 : 1);
    world.shots.push([tw.x, tw.y - 0.8, best.x, best.y, 3]);
  });
  world.units = world.units.filter((u) => u.hp > 0);
}
/** The match ends when a king tower falls, or when time runs out (more towers taken wins). */
function checkEnd(m, t) {
  const crowns = [0, 1].map((s) => TOWERS.reduce((n, tw, i) => n + (tw.side !== s && world.towers[i] <= 0 ? (tw.king ? 3 : 1) : 0), 0)).map((n) => Math.min(3, n));
  const kingDown = crowns.some((c) => c >= 3);
  if (crowns[0] !== m.crowns[0] || crowns[1] !== m.crowns[1]) m = writeMatch({ ...m, crowns });
  if (!kingDown && t < m.endsAt) return;
  const hpLeft = (s) => TOWERS.reduce((n, tw, i) => n + (tw.side === s ? world.towers[i] / fullHp(i) : 0), 0);
  let winner = crowns[0] > crowns[1] ? 0 : crowns[1] > crowns[0] ? 1 : -1, why = kingDown ? "King tower down" : "More towers taken";
  if (winner < 0) { const a = hpLeft(0), b = hpLeft(1); winner = Math.abs(a - b) < 0.01 ? 2 : a > b ? 0 : 1; why = winner === 2 ? "Even fight" : "Towers in better shape"; }
  writeMatch({ ...m, phase: "over", winner, crowns, why, endsAt: t + CONFIG.resultsMs });
}
/** Gone players hand their side to the bot; a waiting player takes the bot's side. */
function fixSides(m) {
  if (ATTRACT) return m;
  const sides = m.sides.slice(), waiting = livePlayers().filter((id) => !sides.includes(id));
  for (const s of [0, 1]) if (sides[s] !== "bot" && !stillHere(sides[s])) sides[s] = "bot";
  for (const s of [0, 1]) if (sides[s] === "bot" && waiting.length) sides[s] = waiting.shift();
  return sides[0] === m.sides[0] && sides[1] === m.sides[1] ? m : writeMatch({ ...m, sides });
}
/** The bot: defend when enemies cross into its half, otherwise save up and push a lane. */
function botTick(side, m, t) {
  const b = world.bots[side] || (world.bots[side] = { ...newHand(), nextAt: t + 1500, save: 6 });

    const [X, Y] = toScreen(p.x, p.y); ctx.globalAlpha = 1 - a; ctx.font = `900 ${Math.max(16, T * 0.9)}px system-ui, sans-serif`; ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = "#000a"; ctx.strokeText(p.text, X, Y - a * 30); ctx.fillStyle = "#fff"; ctx.fillText(p.text, X, Y - a * 30); ctx.globalAlpha = 1;
  }
  if (!ATTRACT) drawHand(m, now);
}
/** The deploy preview while a card is held over the field. */
function drawPreview(m, X, Y, k) {
  const side = mySide(m), [x, y] = toWorld(X, Y), ok = side >= 0 && validSpot(side, x, y, towersNow()), C = CONFIG.cards[k];
  ctx.fillStyle = ok ? "#ffffff33" : "#ff4d5e44"; ctx.beginPath(); ctx.arc(X, Y, T * (C.n > 1 ? 1.2 : 0.9), 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < C.n; i++) { const a = (i / C.n) * Math.PI * 2 + 0.6, off = C.n > 1 ? 0.6 : 0, [sx, sy] = toScreen(x + Math.cos(a) * off, y + Math.sin(a) * off); drawUnit(k, Math.max(0, side), sx, sy, ok ? 0.75 : 0.35, 0, performance.now()); }
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function drawCard(k, s, ex, lifted, small, side = 0) {
  const C = CONFIG.cards[k], y = s.y - (lifted ? 10 : 0), can = ex >= C.cost;
  roundRect(s.x, y, s.w, s.h, 10); ctx.fillStyle = small ? "#2b3a4f" : can ? "#34506e" : "#28323f"; ctx.fill();
  ctx.lineWidth = lifted ? 3 : 1.5; ctx.strokeStyle = lifted ? "#ffd166" : "#ffffff33"; ctx.stroke();
  const saveT = T; T = s.w / (small ? 2.4 : 2.2);
  const n = Math.min(C.n, 3);
  for (let i = 0; i < n; i++) drawUnit(k, side, s.x + s.w / 2 + (i - (n - 1) / 2) * s.w * 0.2, y + s.h * 0.48, can || small ? 1 : 0.5, 0, performance.now() * 0.5);
  T = saveT;
  if (!can && !small) { ctx.fillStyle = "#0008"; roundRect(s.x, y + s.h * (ex / C.cost), s.w, s.h * (1 - ex / C.cost), 10); ctx.fill(); }
  if (small) return;
  ctx.fillStyle = "#c86bff"; ctx.beginPath(); ctx.arc(s.x + 14, y + 14, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "900 15px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(C.cost, s.x + 14, y + 15);
  ctx.font = "700 12px system-ui, sans-serif"; ctx.fillText(C.name, s.x + s.w / 2, y + s.h - 11); ctx.textBaseline = "alphabetic";
}
function drawHand(m, now) {
  const side = mySide(m), ex = myElixir(m), top = H - handH;
  ctx.fillStyle = "#0d1a12"; ctx.fillRect(0, top, W, handH);
  if (side < 0) { ctx.fillStyle = "#fff"; ctx.font = "700 15px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("You're watching. You'll take a side when one is free.", W / 2, top + handH / 2); return; }
  mine.hand.forEach((k, i) => { if (!(drag && drag.slot === i && drag.moved)) drawCard(k, slots[i], ex, selected === i, false, side); });
  drawCard(mine.queue[0], slots.next, ex, false, true, side);
  ctx.fillStyle = "#ffffff99"; ctx.font = "700 11px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("Next", slots.next.x + slots.next.w / 2, slots.next.y - 4);
  // elixir bar
  const bx = slots[0].x, bw = slots[3].x + slots[3].w - bx, by = slots[0].y + slots[0].h + 10, bh = 16;
  roundRect(bx, by, bw, bh, 8); ctx.fillStyle = "#000a"; ctx.fill();
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, "#c86bff"); g.addColorStop(1, "#ff6bd6");
  roundRect(bx, by, bw * (ex / CONFIG.elixirMax), bh, 8); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "#0006"; ctx.lineWidth = 1; for (let i = 1; i < 10; i++) { ctx.beginPath(); ctx.moveTo(bx + (bw * i) / 10, by); ctx.lineTo(bx + (bw * i) / 10, by + bh); ctx.stroke(); }
  ctx.fillStyle = "#fff"; ctx.font = "900 13px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.fillText(Math.floor(ex), bx - 22, by + 13);
  const held = drag && drag.moved ? drag : selected >= 0 && pointer && pointer.y < top ? { slot: selected, x: pointer.x, y: pointer.y } : null;
  if (held) { if (held.y < top) drawPreview(m, held.x, held.y, mine.hand[held.slot]); else drawCard(mine.hand[held.slot], { x: held.x - slots[0].w / 2, y: held.y - slots[0].h / 2, w: slots[0].w, h: slots[0].h }, ex, true, false, side); }
}
let actx = null, lastSound = 0; // sounds start after the first tap (browsers require it)
addEventListener("pointerdown", () => { if (!actx) try { actx = new AudioContext(); } catch {} });
function sound(freq, len, vol = 0.15) {
  const now = performance.now();
  if (!actx || ATTRACT || (len < 0.05 && now - lastSound < 90)) return;
  lastSound = now;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = "square"; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), t + len);
  g.gain.setValueAtTime(vol * 0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t + len + 0.05);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + 0.08);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const nameOf = (id) => (id === "bot" ? "Bot" : id === net.sessionId ? "You" : S.entities.players[id]?.n || "Player");
let board = null, resultsFor = -1, dropped = false;
function hud(m) {
  const t = Date.now(), side = mySide(m), near = side === 1 ? 1 : 0, far = 1 - near;
  if (ATTRACT) { $("top").style.display = "none"; $("net").textContent = ""; }
  $("nmA").textContent = nameOf(m.sides[near]); $("nmB").textContent = nameOf(m.sides[far]);
  $("crA").className = "cr " + (near ? "b" : "a"); $("crB").className = "cr " + (far ? "b" : "a");
  $("crA").textContent = "♛ " + m.crowns[near]; $("crB").textContent = m.crowns[far] + " ♛";
  const left = Math.max(0, m.endsAt - Math.max(t, m.startAt));
  $("clock").textContent = m.phase === "over" ? "Done" : `${Math.floor(left / 60000)}:${String(Math.floor((left % 60000) / 1000)).padStart(2, "0")}`;
  $("clock").className = m.phase === "play" && left < CONFIG.doubleMs ? "x2" : "";
  $("count").textContent = m.phase === "play" && t < m.startAt ? String(Math.ceil((m.startAt - t) / 1000)) : m.phase === "play" && t - m.startAt < 800 ? "Fight!" : "";
  $("hint").style.opacity = performance.now() < hintUntil && side >= 0 && !ATTRACT ? 1 : 0;
  const n = livePlayers().length;
  if (!ATTRACT) $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the battle" : ""}`;
  $("over").hidden = m.phase !== "over" || ATTRACT;
  if (m.phase === "over" && resultsFor !== m.id) showResults(m, side);
}
function showResults(m, side) {
  resultsFor = m.id;
  const won = side >= 0 && m.winner === side;
  $("overTitle").textContent = m.winner === 2 ? "Draw" : side < 0 ? `${SIDE[m.winner].name} wins` : won ? "You win!" : "You lose";
  $("overSub").textContent = `♛ ${m.crowns[Math.max(0, side)]} – ${m.crowns[1 - Math.max(0, side)]} ♛ · ${m.why}`;
  $("again").hidden = side < 0;
  if (won) sound(660, 0.4, 0.3);
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
function playAgain() { const m = match(); if (!m || m.phase !== "over") return; if (isHost()) hostAgain(net.sessionId, { m: m.id }); else net.send("again", { m: m.id }); }
function hostAgain(from, d) { const m = match(); if (m && m.phase === "over" && d && d.m === m.id && m.sides.includes(from)) newMatch(m.id + 1, m.sides); }
$("again").onclick = playAgain;

// ── INPUT ───────────────────────────────────────────────────────────────────────────
let drag = null, pointer = null;
const slotAt = (x, y) => slots.findIndex((s) => x >= s.x && x <= s.x + s.w && y >= s.y - 12 && y <= s.y + s.h);
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); pointer = { x: e.clientX, y: e.clientY };
  const slot = slotAt(e.clientX, e.clientY);
  if (slot >= 0) { drag = { slot, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false }; cv.setPointerCapture(e.pointerId); return; }
  if (selected >= 0 && e.clientY < H - handH) { const [x, y] = toWorld(e.clientX, e.clientY); deploy(selected, x, y); }
});
cv.addEventListener("pointermove", (e) => {
  pointer = { x: e.clientX, y: e.clientY };
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (Math.hypot(drag.x - drag.sx, drag.y - drag.sy) > 10) drag.moved = true;
});
cv.addEventListener("pointerup", (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) { selected = selected === d.slot ? -1 : d.slot; return; }
  if (e.clientY < H - handH) { const [x, y] = toWorld(e.clientX, e.clientY); deploy(d.slot, x, y); }
});
cv.addEventListener("pointercancel", () => { drag = null; });
addEventListener("keydown", (e) => { const i = "1234".indexOf(e.key); if (i >= 0) selected = selected === i ? -1 : i; if (e.key === "Escape") selected = -1; });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let myName = "", myColor = COLORS[0], last = performance.now(), lastHb = 0, lastHud = 0;
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];
if (!myName) { myName = pickOne(NAME_A) + " " + pickOne(NAME_B); try { localStorage.setItem("mpa-name", myName); } catch {} }
if (ATTRACT) { Object.assign(CONFIG, { countdownMs: 300, matchMs: 70000, resultsMs: 2000, elixirStart: 8 }); $("hint").style.display = "none"; }

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  if (isHost()) hostTick(now); else { world.wasHost = false; world.lastTick = 0; }
  const m = match();
  if (m) {
    if (mine.matchId !== m.id) { mine = { ...newHand(), matchId: m.id }; selected = -1; views.clear(); lastTowers = null; }
    draw(m, dt, now);
    if (now - lastHud > 100) { lastHud = now; hud(m); }
  }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("play", (d, from) => { if (isHost() && d) applyPlay(match()?.sides.indexOf(from) ?? -1, d); });
  net.on("again", (d, from) => { if (isHost()) hostAgain(from, d); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || pickOne(COLORS);
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
